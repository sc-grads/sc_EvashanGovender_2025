name: Main SSIS Migration

on:
  workflow_dispatch:

jobs:
  create-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SQL Tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          
      - name: Add sqlcmd to PATH
        run: |
          echo "/opt/mssql-tools/bin" >> $GITHUB_PATH

      - name: Create Database
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASSWORD }}" -i "HandsOnProject/Timesheet/CreateDatabaseAndTable.sql"

  deploy-ssis:
    needs: create-database
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Set ISPAC path
        shell: cmd
        run: |
          set ISPAC_PATH=%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac
          echo ISPAC_PATH is set to: %ISPAC_PATH%
  
      - name: Verify ISPAC file
        shell: cmd
        run: |
          echo Checking file at: %ISPAC_PATH%
          if not exist "%ISPAC_PATH%" (
            echo Error: ISPAC file not found
            exit /b 1
          )

      - name: Create SSIS Catalog Folder
        shell: cmd
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASSWORD }}" ^
          -Q "IF NOT EXISTS(SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = 'SSISMigrationProject') BEGIN EXEC [SSISDB].[catalog].[create_folder] @folder_name = 'SSISMigrationProject', @folder_id = NULL END"

      - name: Prepare Deployment Script
        shell: cmd
        run: |
          echo USE [SSISDB] > deploy.sql
          echo GO >> deploy.sql
          echo DECLARE @ProjectBinary AS varbinary(max) >> deploy.sql
          echo DECLARE @operation_id AS bigint >> deploy.sql
          echo SET @ProjectBinary = (SELECT * FROM OPENROWSET(BULK '%ISPAC_PATH%', SINGLE_BLOB) AS BinaryData) >> deploy.sql
          echo EXEC [catalog].[deploy_project] @folder_name = 'SSISMigrationProject', @project_name = 'SSIS_Project', @Project_Stream = @ProjectBinary, @operation_id = @operation_id out >> deploy.sql
          echo GO >> deploy.sql

      - name: Deploy SSIS Project
        shell: cmd
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASSWORD }}" -i deploy.sql

  create-and-run-job:
    needs: deploy-ssis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SQL Tools
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools

      - name: Add sqlcmd to PATH
        run: |
          echo "/opt/mssql-tools/bin" >> $GITHUB_PATH

      - name: Create SQL Agent Job
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASSWORD }}" -i "HandsOnProject/Timesheet/CreateJob.sql"

      - name: Run SQL Agent Job
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASSWORD }}" -Q "EXEC msdb.dbo.sp_start_job @job_name = N'Execute_SSIS_Package_Job';"
