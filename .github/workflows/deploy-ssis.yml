name: deploy-ssis

on:
  workflow_call:

jobs:
  deploy-ssis:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate .ispac file exists
        run: |
          if not exist "%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac" (^
            echo "::error::.ispac file not found at '%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac'" ^
            exit 1^
          )
        shell: cmd

      - name: Deploy using T-SQL
        run: |
          sqlcmd -S SAMBE2025002\MSSQLSERVER2 -E -v IspacPath="%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac" -Q "USE [SSISDB] GO  DECLARE @ProjectBinary AS varbinary(max) DECLARE @operation_id AS bigint SET @ProjectBinary = (SELECT * FROM OPENROWSET(BULK "%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac", SINGLE_BLOB) AS BinaryData) EXEC [catalog].[deploy_project] @folder_name = 'SSISMigrationProject', @Project_Stream = @ProjectBinary, @operation_id = @operation_id out GO;"
          
          
