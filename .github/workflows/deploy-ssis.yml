name: deploy-ssis

on:
  workflow_call:

jobs:
  deploy-ssis:
    runs-on: self-hosted  # Windows runner with SSIS tools
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SSIS Catalog Folder
        shell: cmd
        run: |
          sqlcmd -S rntpc-105-184-110-221.a.free.pinggy.link,32947 -U Auto_User -P 12345 -Q ^
          "IF NOT EXISTS(SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = 'SSISMigrationProject') " ^
          "BEGIN EXEC [SSISDB].[catalog].[create_folder] @folder_name = 'SSISMigrationProject', @folder_id = NULL END"

      - name: Prepare Deployment Script
        shell: cmd
        run: |
          echo USE [SSISDB] > deploy.sql
          echo GO >> deploy.sql
          echo DECLARE @ProjectBinary AS varbinary(max) >> deploy.sql
          echo DECLARE @operation_id AS bigint >> deploy.sql
          echo SET @ProjectBinary = (SELECT * FROM OPENROWSET(BULK '%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\YourSSISProject.ispac', SINGLE_BLOB) AS BinaryData) >> deploy.sql
          echo EXEC [catalog].[deploy_project] @folder_name = 'SSISMigrationProject', @project_name = 'SSIS_Project', @Project_Stream = @ProjectBinary, @operation_id = @operation_id out >> deploy.sql
          echo GO >> deploy.sql

      - name: Deploy SSIS Project
        shell: cmd
        run: |
          sqlcmd -S rntpc-105-184-110-221.a.free.pinggy.link,32947 -U Auto_User -P 12345 -i deploy.sql
