name: deploy-ssis

on:
  workflow_call:

jobs:
  deploy-ssis:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set ISPAC path
        shell: cmd
        run: |
          echo ISPAC_PATH=%cd%\HandsOnProject\Timesheet\SSISProjectTrial.ispac >> %GITHUB_ENV%
          echo ISPAC_PATH is set to: %cd%\HandsOnProject\Timesheet\SSISProjectTrial.ispac

      - name: Verify ISPAC file
        shell: cmd
        run: |
          echo "Checking file at: %ISPAC_PATH%"
          if not exist "%ISPAC_PATH%" (
            echo Error: ISPAC file not found
            dir "%cd%\HandsOnProject\Timesheet"
            exit /b 1
          )

      - name: Create SSIS Catalog Folder
        shell: cmd
        run: |
          sqlcmd -S SAMBE2025002\MSSQLSERVER2 -E -Q "IF NOT EXISTS(SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = 'SSISMigrationProject') BEGIN EXEC [SSISDB].[catalog].[create_folder] @folder_name = 'SSISMigrationProject', @folder_id = NULL END"

      - name: Prepare Deployment Script
        shell: cmd
        run: |
          echo USE [SSISDB] > deploy.sql
          echo GO >> deploy.sql
          echo DECLARE @ProjectBinary AS varbinary(max) >> deploy.sql
          echo DECLARE @operation_id AS bigint >> deploy.sql
          echo SET @ProjectBinary = (SELECT * FROM OPENROWSET(BULK '%ISPAC_PATH%', SINGLE_BLOB) AS BinaryData) >> deploy.sql
          echo EXEC [catalog].[deploy_project] @folder_name = 'SSISMigrationProject', @project_name = 'SSIS_Project', @Project_Stream = @ProjectBinary, @operation_id = @operation_id OUT >> deploy.sql
          echo GO >> deploy.sql

      - name: Deploy SSIS Project
        shell: cmd
        run: |
          sqlcmd -S SAMBE2025002\MSSQLSERVER2 -E -i deploy.sql 

          
          
