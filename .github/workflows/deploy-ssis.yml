name: deploy-ssis

on:
  workflow_call:

jobs:
  deploy-ssis:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Prepare Deployment Script
        shell: cmd
        run: |
          echo USE [SSISDB] > deploy.sql
          echo GO >> deploy.sql
          echo DECLARE @ProjectBinary AS varbinary(max) >> deploy.sql
          echo DECLARE @operation_id AS bigint >> deploy.sql
          echo SET @ProjectBinary = (SELECT * FROM OPENROWSET(BULK '%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac', SINGLE_BLOB) AS BinaryData) >> deploy.sql
          echo EXEC [catalog].[deploy_project] @folder_name = 'SSISMigrationProject', @project_name = 'SSIS_Project', @Project_Stream = @ProjectBinary, @operation_id = @operation_id out >> deploy.sql
          echo GO >> deploy.sql

      - name: Deploy using T-SQL
        run: |
          sqlcmd -S SAMBE2025002\MSSQLSERVER2 -E -v IspacPath=%GITHUB_WORKSPACE%\HandsOnProject\Timesheet\SSISProjectTrial.ispac -i deploy.sql
          
